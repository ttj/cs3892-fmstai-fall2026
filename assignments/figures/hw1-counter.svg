<title id="t">The HW1 Part 3 counter</title>
<desc id="d">A chain of states x = 0 through x = 11. x starts at 0 and every step adds exactly 1. States 0 through 10 satisfy the safety property x is at most 10; state 11 is the state the homework asks about.</desc>
