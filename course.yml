# Reading-list sizes are recorded per discussion above (`urls` / `unverified`).
# Two rewrites have passed through these files and both times the count was
# what proved nothing had been silently dropped. Per-discussion rather than one
# global total on purpose: adding a source should be a local, obviously-correct
# edit to that packet's number, not a recomputation of a magic global.

# Sections every student packet must contain, in this order.
packet_sections:
  - "Background"
  - "The question"
  - "Discussion questions"
  - "Why this is in a formal-methods course"
  - "Readings"
  - "What you submit"

# Sections every instructor guide must contain.
instructor_guide_sections:
  - "30-minute run sheet"
  - "Do not assert these"

# ---------------------------------------------------------------------------
# Content that must NEVER appear in the class-facing repo. This repo is shared
# with students; these patterns are the ones that actually leaked during
# drafting, plus the obvious categories.
# ---------------------------------------------------------------------------
forbidden_in_class_repo:
  instructor_apparatus:
    - "30-minute run sheet"
    - "Do not assert these"
    - "landmine"
    - "answer key"
    - "grading key"
    - "marking scheme"
  instructor_voice:
    - "assign only"
    - "if you assign"
    - "the instructor must"
    - "students will bring"
    - "students most reliably"
    - "tell the students to"
  # Matched case-sensitively: the all-caps stage-direction label is the problem,
  # not the ordinary phrase "cuts against the framing", which is fine in prose
  # addressed to a student.
  instructor_voice_exact:
    - "CUTS AGAINST THE FRAMING"
    - "TODO"
    - "FIXME"
  secrets:
    - "BEGIN RSA PRIVATE KEY"
    - "BEGIN OPENSSH PRIVATE KEY"
    - "AKIA"
    - "aws_secret_access_key"
  student_data:
    - "class-roll"
    - "classlist"

# Files that must never exist in either repo (agent scratch, editor leftovers).
forbidden_paths:
  - "*-draft.md"
  - "*-scratch.md"
  - "*.tmp"
  - "Untitled*"
  - "*.orig"
  - "*.rej"

